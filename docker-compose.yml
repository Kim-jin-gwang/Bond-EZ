services:
  # --- Infrastructure ---
  elasticsearch:
    build:
      context: ./data-pjt/logstash
      dockerfile: Dockerfile.elasticsearch
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - ./data-pjt/elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - de_net
      - web_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
    networks:
      - de_net
      - web_net

  # --- Application Services ---
  backend:
    build:
      context: ./backend-pjt
      dockerfile: Dockerfile.dev
    container_name: django-backend
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./backend-pjt:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
      - ELASTICSEARCH_BONDS_INDEX=${ELASTICSEARCH_BONDS_INDEX:-bonds_search}
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - de_net
      - web_net

  frontend:
    build:
      context: ./frontend-pjt
      dockerfile: Dockerfile.dev
    container_name: vue-frontend
    stdin_open: true
    tty: true
    volumes:
      - ./frontend-pjt:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - web_net

  logstash:
    build:
      context: ./data-pjt/logstash
      dockerfile: Dockerfile.logstash
    container_name: logstash
    restart: always
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_BONDS_INDEX=${ELASTICSEARCH_BONDS_INDEX:-bonds_search}
      - JDBC_CONNECTION_STRING=jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB}?sslmode=require
      - JDBC_USER=${POSTGRES_USER}
      - JDBC_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./data-pjt/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data-pjt/logstash/templates:/usr/share/logstash/templates:ro
      - ./data-pjt/logstash/state:/usr/share/logstash/state
    networks:
      - de_net

networks:
  de_net:
    external: true
  web_net:
    external: true
