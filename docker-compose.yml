services:
  # --- Infrastructure ---
  elasticsearch:
    build:
      context: ./data-pjt/logstash
      dockerfile: Dockerfile.elasticsearch
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - ./data-pjt/elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - de_net
      - web_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
    networks:
      - de_net
      - web_net

  logstash:
    build:
      context: ./data-pjt/logstash
      dockerfile: Dockerfile.logstash
    container_name: logstash
    restart: always
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_BONDS_INDEX=${ELASTICSEARCH_BONDS_INDEX:-bonds_search}
      - JDBC_CONNECTION_STRING=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?sslmode=require
      - JDBC_USER=${POSTGRES_USER}
      - JDBC_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./data-pjt/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data-pjt/logstash/templates:/usr/share/logstash/templates:ro
      - ./data-pjt/logstash/state:/usr/share/logstash/state
    depends_on:
      - elasticsearch
    networks:
      - de_net

  db:
    container_name: postgres
    image: pgvector/pgvector:pg16
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./data-pjt/postgres_data:/var/lib/postgresql/data
      - ./data-pjt/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - de_net

  # --- Kafka ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - de_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - de_net

  # --- Spark ---
  spark-master:
    image: apache/spark:3.5.4
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - de_net

  spark-worker:
    image: apache/spark:3.5.4
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - de_net

  # --- Airflow (Optimized with LocalExecutor) ---
  airflow-webserver:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-webserver
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB:-bonds_db}
      - POSTGRES_USER=${POSTGRES_USER:-ssafyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ssafy}
      - DB_HOST=db
      - DB_PORT=5432
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary pandas}
    env_file:
      - .env
    volumes:
      - ./data-pjt/airflow/dags:/opt/airflow/dags
      - ./data-pjt/airflow/logs:/opt/airflow/logs
      - ./data-pjt/airflow/plugins:/opt/airflow/plugins
      - ./data-pjt:/app
    ports:
      - "8081:8080"
    command: webserver
    networks:
      - de_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-scheduler
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB:-bonds_db}
      - POSTGRES_USER=${POSTGRES_USER:-ssafyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ssafy}
      - DB_HOST=db
      - DB_PORT=5432
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary pandas}
    env_file:
      - .env
    volumes:
      - ./data-pjt/airflow/dags:/opt/airflow/dags
      - ./data-pjt/airflow/logs:/opt/airflow/logs
      - ./data-pjt/airflow/plugins:/opt/airflow/plugins
      - ./data-pjt:/app
    command: scheduler
    networks:
      - de_net

  airflow-init:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-bonds_db}
      - POSTGRES_USER=${POSTGRES_USER:-ssafyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ssafy}
      - DB_HOST=db
      - DB_PORT=5432
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary pandas}
    env_file:
      - .env
    command: version
    networks:
      - de_net

  # --- Flink ---
  flink-jobmanager:
    build:
      context: .
      dockerfile: data-pjt/flink/Dockerfile.flink
    container_name: flink-jobmanager
    restart: always
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks:
      - de_net

  flink-taskmanager:
    build:
      context: .
      dockerfile: data-pjt/flink/Dockerfile.flink
    container_name: flink-taskmanager
    restart: always
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - de_net

  # --- News Collection Pipeline ---
  news-crawler:
    build:
      context: ./data-pjt
      dockerfile: Dockerfile.dev
    container_name: news-crawler
    restart: always
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./data-pjt:/app
    command: python producer/news_crawler.py
    networks:
      - de_net

  flink-job-submitter:
    build:
      context: .
      dockerfile: data-pjt/flink/Dockerfile.flink
    container_name: flink-job-submitter
    restart: on-failure
    depends_on:
      - flink-jobmanager
      - db
    volumes:
      - ./data-pjt:/app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_DB=bonds_db
      - POSTGRES_USER=ssafyuser
      - POSTGRES_PASSWORD=ssafy
      - DB_HOST=db
      - DB_PORT=5432
    command: >
      bash -c "sleep 15 && flink run -m flink-jobmanager:8081 -py /app/flink/news_processor.py"
    networks:
      - de_net

  # --- Application Services ---
  backend:
    build:
      context: ./backend-pjt
      dockerfile: Dockerfile.dev
    container_name: django-backend
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./backend-pjt:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_BONDS_INDEX=${ELASTICSEARCH_BONDS_INDEX:-bonds_search}
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - de_net
      - web_net

  frontend:
    build:
      context: ./frontend-pjt
      dockerfile: Dockerfile.dev
    container_name: vue-frontend
    stdin_open: true
    tty: true
    volumes:
      - ./frontend-pjt:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - web_net

networks:
  de_net:
    driver: bridge
  web_net:
    driver: bridge
