services:
  db:
    container_name: postgres
    image: pgvector/pgvector:pg16
    volumes:
      - ./data-pjt/postgres_data:/var/lib/postgresql/data
      - ./data-pjt/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - de_net

  backend:
    build:
      context: ./backend-pjt
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend-pjt:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
    networks:
      - de_net
      - web_net

  frontend:
    build:
      context: ./frontend-pjt
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend-pjt:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - web_net

networks:
  de_net:
    driver: bridge
  web_net:
    driver: bridge
