services:
  # --- Infrastructure ---
  db:
    container_name: postgres
    image: pgvector/pgvector:pg16
    stdin_open: true
    tty: true
    volumes:
      - ./data-pjt/postgres_data:/var/lib/postgresql/data
      - ./data-pjt/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - de_net

  # --- Kafka ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - de_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - de_net

  # --- Spark ---
  spark-master:
    image: apache/spark:3.5.4
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - de_net

  spark-worker:
    image: apache/spark:3.5.4
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - de_net

  # --- Airflow (Optimized with LocalExecutor) ---
  airflow-webserver:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-webserver
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary}
    env_file:
      - .env
    volumes:
      - ./data-pjt/airflow/dags:/opt/airflow/dags
      - ./data-pjt/airflow/logs:/opt/airflow/logs
      - ./data-pjt/airflow/plugins:/opt/airflow/plugins
    ports:
      - "8081:8080"
    command: webserver
    networks:
      - de_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-scheduler
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary}
    env_file:
      - .env
    volumes:
      - ./data-pjt/airflow/dags:/opt/airflow/dags
      - ./data-pjt/airflow/logs:/opt/airflow/logs
      - ./data-pjt/airflow/plugins:/opt/airflow/plugins
    command: scheduler
    networks:
      - de_net

  airflow-init:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary}
    env_file:
      - .env
    command: version
    networks:
      - de_net

  # --- Application Services ---
  backend:
    build:
      context: ./backend-pjt
      dockerfile: Dockerfile.dev
    container_name: django-backend
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./backend-pjt:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - de_net
      - web_net

  frontend:
    build:
      context: ./frontend-pjt
      dockerfile: Dockerfile.dev
    container_name: vue-frontend
    stdin_open: true
    tty: true
    volumes:
      - ./frontend-pjt:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - web_net

networks:
  de_net:
    driver: bridge
  web_net:
    driver: bridge
