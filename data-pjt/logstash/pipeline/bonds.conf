input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/vendor/jar/jdbc/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "${JDBC_CONNECTION_STRING}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    jdbc_paging_enabled => true
    jdbc_page_size => 1000
    schedule => "*/5 * * * *"
    use_column_value => true
    tracking_column => "search_updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/state/bonds_last_run.yml"
    statement => "
      SELECT
        b.bond_id,
        b.isin_code,
        b.short_code,
        b.bond_name,
        b.short_name,
        b.issue_date,
        b.maturity_date,
        GREATEST(
          b.updated_at,
          i.updated_at,
          bt.updated_at,
          cr.updated_at,
          s.updated_at,
          gs.updated_at,
          COALESCE(cfr.updated_at, b.updated_at),
          COALESCE(boe.updated_at, b.updated_at),
          COALESCE(lmd.base_date::timestamp, b.updated_at)
        ) AS search_updated_at,
        EXTRACT(day FROM (b.maturity_date::timestamp - CURRENT_DATE::timestamp)) / 365.0 AS maturity_years,
        b.coupon_rate,
        b.interest_type,
        COALESCE(
          b.payment_cycle_months,
          nullif(regexp_replace(cfr.interest_payment_unit_months, '[^0-9]', '', 'g'), '')::integer
        ) AS payment_cycle_months,
        bt.bond_type,
        i.issuer_id,
        i.issuer_name,
        ind.industry_id,
        ind.industry_name,
        cr.rating_name,
        regexp_replace(cr.rating_name, '[+\\-0-9]+$', '') AS rating_group,
        s.seniority_name AS seniority,
        gs.guarantee_status,
        COALESCE(boe.option_type, '없음') AS option_type,
        boe.exercise_start_date_1 AS next_exercise_date,
        lmd.market_data_id,
        lmd.base_date AS market_base_date,
        lmd.price,
        lmd.ytm,
        lmd.trading_volume,
        nullif(regexp_replace(lmd.bid_yield, '[^0-9.\\-]', '', 'g'), '')::double precision AS bid_yield,
        nullif(regexp_replace(lmd.ask_yield, '[^0-9.\\-]', '', 'g'), '')::double precision AS ask_yield,
        nullif(regexp_replace(lmd.price_change_rate, '[^0-9.\\-]', '', 'g'), '')::double precision AS price_change_rate
      FROM bond b
      JOIN bond_type bt ON bt.bond_type_id = b.bond_type_id
      JOIN issuer i ON i.issuer_id = b.issuer_id
      JOIN industry ind ON ind.industry_id = i.industry_id
      JOIN credit_rating cr ON cr.rating_id = b.rating_id
      JOIN seniority s ON s.seniority_id = b.seniority_id
      JOIN guarantee_status gs ON gs.guarantee_status_id = b.guarantee_status_id
      LEFT JOIN bond_cashflow_rule cfr ON cfr.cashflow_rule_id = b.cashflow_rule_id
      LEFT JOIN bond_option_exercise boe ON boe.option_exercise_id = b.option_exercise_id
      LEFT JOIN latest_bond_market_data lmd ON lmd.bond_id = b.bond_id
      WHERE b.deleted_at IS NULL
        AND GREATEST(
          b.updated_at,
          i.updated_at,
          bt.updated_at,
          cr.updated_at,
          s.updated_at,
          gs.updated_at,
          COALESCE(cfr.updated_at, b.updated_at),
          COALESCE(boe.updated_at, b.updated_at),
          COALESCE(lmd.base_date::timestamp, b.updated_at)
        ) > :sql_last_value
      ORDER BY search_updated_at ASC, b.bond_id ASC
    "
  }
}

filter {
  mutate {
    copy => { "bond_id" => "[@metadata][_id]" }
    remove_field => ["@version", "@timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "${ELASTICSEARCH_BONDS_INDEX}"
    document_id => "%{[@metadata][_id]}"
    action => "update"
    doc_as_upsert => true
    template => "/usr/share/logstash/templates/bonds_search_template.json"
    template_name => "bonds_search"
    template_overwrite => true
  }
  stdout { codec => dots }
}
