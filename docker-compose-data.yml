services:
  # --- Kafka ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - de_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - de_net

  # --- Spark ---
  spark-master:
    image: apache/spark:3.5.4
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - de_net

  spark-worker:
    image: apache/spark:3.5.4
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - de_net

  # --- Hadoop (HDFS) ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./data-pjt/hadoop_data/namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_tmp_dir=/hadoop/tmp
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_replication=1
    networks:
      - de_net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - ./data-pjt/hadoop_data/datanode:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_tmp_dir=/hadoop/tmp
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_replication=1
    networks:
      - de_net

  # --- Airflow (Optimized with LocalExecutor) ---
  airflow-webserver:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-webserver
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB:-bonds_db}
      - POSTGRES_USER=${POSTGRES_USER:-ssafyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ssafy}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary pandas}
    env_file:
      - .env
    volumes:
      - ./data-pjt/airflow/dags:/opt/airflow/dags
      - ./data-pjt/airflow/logs:/opt/airflow/logs
      - ./data-pjt/airflow/plugins:/opt/airflow/plugins
      - ./data-pjt:/app
    ports:
      - "8081:8080"
    command: webserver
    networks:
      - de_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-scheduler
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB:-bonds_db}
      - POSTGRES_USER=${POSTGRES_USER:-ssafyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ssafy}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary pandas}
    env_file:
      - .env
    volumes:
      - ./data-pjt/airflow/dags:/opt/airflow/dags
      - ./data-pjt/airflow/logs:/opt/airflow/logs
      - ./data-pjt/airflow/plugins:/opt/airflow/plugins
      - ./data-pjt:/app
    command: scheduler
    networks:
      - de_net

  airflow-init:
    build:
      context: .
      dockerfile: data-pjt/airflow/Dockerfile.airflow
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/airflow
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-bonds_db}
      - POSTGRES_USER=${POSTGRES_USER:-ssafyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ssafy}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - _PIP_ADDITIONAL_REQUIREMENTS=${AIRFLOW_PIP_DEPS:-kafka-python python-dotenv requests pyspark psycopg2-binary pandas}
    env_file:
      - .env
    command: version
    networks:
      - de_net

  # --- Flink ---
  flink-jobmanager:
    build:
      context: .
      dockerfile: data-pjt/flink/Dockerfile.flink
    container_name: flink-jobmanager
    restart: always
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      - HADOOP_CLASSPATH=/opt/flink/hadoop/*
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks:
      - de_net

  flink-taskmanager:
    build:
      context: .
      dockerfile: data-pjt/flink/Dockerfile.flink
    container_name: flink-taskmanager
    restart: always
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - HADOOP_CLASSPATH=/opt/flink/hadoop/*
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - de_net

  # --- News Collection Pipeline ---
  news-crawler:
    build:
      context: ./data-pjt
      dockerfile: Dockerfile.dev
    container_name: news-crawler
    restart: always
    depends_on:
      - kafka
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./data-pjt:/app
    command: python producer/news_crawler.py
    networks:
      - de_net

  flink-job-submitter:
    build:
      context: .
      dockerfile: data-pjt/flink/Dockerfile.flink
    container_name: flink-job-submitter
    restart: on-failure
    depends_on:
      - flink-jobmanager
    volumes:
      - ./data-pjt:/app
    env_file:
      - .env
    environment:
      - HADOOP_CLASSPATH=/opt/flink/hadoop/*
    command: >
      bash -c "sleep 15 && flink run -m flink-jobmanager:8081 -py /app/flink/news_processor.py"
    networks:
      - de_net

networks:
  de_net:
    external: true
  web_net:
    external: true
